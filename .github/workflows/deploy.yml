name: Deploy book to GitHub Pages

on:
  push:
    branches:
      - main
  # Lets you re-run a deployment from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN permissions for the whole workflow. No secrets are configured or
# needed: `pages: write` + `id-token: write` let actions/deploy-pages mint a
# short-lived OIDC token for the Pages service.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. cancel-in-progress is deliberately false: an
# in-flight production deploy is allowed to finish. Runs queued behind the
# newest one are skipped, so the latest commit still wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    defaults:
      run:
        # Every `run` step in this job executes inside book/, so backend/ is
        # never installed or built.
        working-directory: book
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so Docusaurus can derive last-updated timestamps from
          # git if that option is ever enabled.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # `working-directory` does not apply to action inputs, so the lockfile
          # path must be given relative to the repo root.
          cache-dependency-path: book/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Also an action input, so also relative to the repo root.
          path: book/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
